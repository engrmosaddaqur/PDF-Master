name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build app-debug.apk (v1.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          javac -version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Initialize and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions, PDF intent filters, version 1.1, and icons
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.CAMERA\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />"
            ];
            for (const perm of perms) {
              const nameMatch = perm.match(/android:name="([^"]+)"/);
              if (nameMatch && !xml.includes(nameMatch[1])) {
                xml = xml.replace("<application", "    " + perm + "\n    <application");
              }
            }
            if (!xml.includes("android.hardware.camera")) {
              xml = xml.replace(
                "<application",
                "    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <application"
              );
            }
            if (!xml.includes("application/pdf")) {
              const pdfFilters = [
                "            <intent-filter>",
                "                <action android:name=\"android.intent.action.VIEW\" />",
                "                <category android:name=\"android.intent.category.DEFAULT\" />",
                "                <category android:name=\"android.intent.category.BROWSABLE\" />",
                "                <data android:scheme=\"content\" />",
                "                <data android:scheme=\"file\" />",
                "                <data android:mimeType=\"application/pdf\" />",
                "            </intent-filter>",
                "            <intent-filter>",
                "                <action android:name=\"android.intent.action.SEND\" />",
                "                <category android:name=\"android.intent.category.DEFAULT\" />",
                "                <data android:mimeType=\"application/pdf\" />",
                "            </intent-filter>"
              ].join("\n");
              xml = xml.replace("</activity>", pdfFilters + "\n        </activity>");
            }
            fs.writeFileSync(manifestPath, xml, "utf8");

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const runNum = parseInt(process.env.BUILD_NUM || "1", 10) || 1;
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + runNum);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, "versionName \"1.1\"");
            fs.writeFileSync(gradlePath, gradle, "utf8");
          '
          node -e '
            const fs = require("fs");
            const path = require("path");
            const mainActPath = "android/app/src/main/java/com/engrmosaddaqur/pdfmaster/MainActivity.java";
            fs.mkdirSync(path.dirname(mainActPath), { recursive: true });
            const javaSrc = [
              "package com.engrmosaddaqur.pdfmaster;",
              "",
              "import android.content.Intent;",
              "import android.database.Cursor;",
              "import android.net.Uri;",
              "import android.os.Bundle;",
              "import android.provider.OpenableColumns;",
              "import android.webkit.JavascriptInterface;",
              "import android.webkit.WebView;",
              "import com.getcapacitor.BridgeActivity;",
              "import java.io.File;",
              "import java.io.FileOutputStream;",
              "import java.io.InputStream;",
              "import java.util.concurrent.ExecutorService;",
              "import java.util.concurrent.Executors;",
              "import org.json.JSONObject;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "    private final ExecutorService pdfExecutor = Executors.newSingleThreadExecutor();",
              "    private final Object pendingLock = new Object();",
              "    private String pendingPdfJson = null;",
              "",
              "    public class PdfIntentBridge {",
              "        @JavascriptInterface",
              "        public String consumePendingPdf() {",
              "            synchronized (pendingLock) {",
              "                String out = pendingPdfJson;",
              "                pendingPdfJson = null;",
              "                return out;",
              "            }",
              "        }",
              "    }",
              "",
              "    @Override",
              "    protected void onCreate(Bundle savedInstanceState) {",
              "        super.onCreate(savedInstanceState);",
              "        if (this.getBridge() != null && this.getBridge().getWebView() != null) {",
              "            this.getBridge().getWebView().addJavascriptInterface(new PdfIntentBridge(), \"AndroidPdfBridge\");",
              "        }",
              "    }",
              "",
              "    @Override",
              "    protected void onNewIntent(Intent intent) {",
              "        super.onNewIntent(intent);",
              "        handlePdfIntent(intent);",
              "    }",
              "",
              "    private void handlePdfIntent(Intent intent) {",
              "        if (intent == null) return;",
              "        String action = intent.getAction();",
              "        Uri uri = null;",
              "        if (Intent.ACTION_VIEW.equals(action)) {",
              "            uri = intent.getData();",
              "        } else if (Intent.ACTION_SEND.equals(action)) {",
              "            Bundle extras = intent.getExtras();",
              "            if (extras != null) {",
              "                Object streamObj = extras.get(Intent.EXTRA_STREAM);",
              "                if (streamObj instanceof Uri) {",
              "                    uri = (Uri) streamObj;",
              "                }",
              "            }",
              "        }",
              "        if (uri == null) return;",
              "        final Uri targetUri = uri;",
              "        pdfExecutor.execute(() -> {",
              "            try {",
              "                String fileName = resolveDisplayName(targetUri);",
              "                File outFile = new File(getCacheDir(), \"incoming_open.pdf\");",
              "                try (InputStream in = getContentResolver().openInputStream(targetUri);",
              "                     FileOutputStream out = new FileOutputStream(outFile)) {",
              "                    if (in == null) return;",
              "                    byte[] buf = new byte[8192];",
              "                    int read;",
              "                    while ((read = in.read(buf)) != -1) {",
              "                        out.write(buf, 0, read);",
              "                    }",
              "                    out.flush();",
              "                }",
              "                JSONObject payload = new JSONObject();",
              "                payload.put(\"name\", fileName);",
              "                payload.put(\"cacheFile\", \"incoming_open.pdf\");",
              "                synchronized (pendingLock) {",
              "                    pendingPdfJson = payload.toString();",
              "                }",
              "                runOnUiThread(() -> {",
              "                    if (getBridge() != null) {",
              "                        WebView wv = getBridge().getWebView();",
              "                        if (wv != null) {",
              "                            wv.evaluateJavascript(\"window.dispatchEvent(new CustomEvent(\x27pm-open-external-pdf\x27));\", null);",
              "                        }",
              "                    }",
              "                });",
              "            } catch (Exception ignored) {",
              "            }",
              "        });",
              "    }",
              "",
              "    private String resolveDisplayName(Uri uri) {",
              "        String result = null;",
              "        if (\"content\".equals(uri.getScheme())) {",
              "            try (Cursor cursor = getContentResolver().query(uri, null, null, null, null)) {",
              "                if (cursor != null && cursor.moveToFirst()) {",
              "                    int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);",
              "                    if (idx >= 0) result = cursor.getString(idx);",
              "                }",
              "            } catch (Exception ignored) {",
              "            }",
              "        }",
              "        if (result == null || result.trim().isEmpty()) {",
              "            result = uri.getLastPathSegment();",
              "        }",
              "        if (result == null || result.trim().isEmpty()) {",
              "            result = \"document.pdf\";",
              "        }",
              "        int slash = result.lastIndexOf(\x27/\x27);",
              "        if (slash != -1 && slash + 1 < result.length()) {",
              "            result = result.substring(slash + 1);",
              "        }",
              "        if (!result.toLowerCase().endsWith(\".pdf\")) {",
              "            result = result + \".pdf\";",
              "        }",
              "        return result;",
              "    }",
              "}",
              ""
            ].join("\n");
            fs.writeFileSync(mainActPath, javaSrc, "utf8");
          '
          node -e '
            const fs = require("fs");
            fs.mkdirSync("android/app/src/main/res/values", { recursive: true });
            fs.writeFileSync(
              "android/app/src/main/res/values/ic_launcher_background.xml",
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#020A24</color>\n</resources>\n",
              "utf8"
            );
          '
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png"
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
              cp public/pwa-maskable-512x512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

      - name: Verify Debug APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-v1.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (v1.1)
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: PDF MASTER v1.1.${{ github.run_number }}
          body: |
            Automated Android APK build for **PDF MASTER v1.1** (by Mosaddaq).
            - Opens PDF files directly from Phone Storage / File Manager into PDF Viewer mode
            - Includes 3-dot (...) menu **Save to Local Storage** & **Edit Mode** full-app unlock
            - Previous v1.0 releases remain preserved in Releases history

            ### Direct Download
            `https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk`
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
