name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          javac -version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Initialize and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions and launcher icons
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "<uses-permission android:name=\"android.permission.INTERNET\" />",
              "<uses-permission android:name=\"android.permission.CAMERA\" />",
              "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
              "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />",
              "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />"
            ];
            for (const perm of perms) {
              const nameMatch = perm.match(/android:name="([^"]+)"/);
              if (nameMatch && !xml.includes(nameMatch[1])) {
                xml = xml.replace("<application", "    " + perm + "\n    <application");
              }
            }
            if (!xml.includes("android.hardware.camera")) {
              xml = xml.replace(
                "<application",
                "    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <application"
              );
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              cp public/pwa-192x192.png "$dir/ic_launcher.png"
              cp public/pwa-192x192.png "$dir/ic_launcher_round.png"
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug --no-daemon

      - name: Verify Debug APK output
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF MASTER v1.0.${{ github.run_number }}
          body: |
            Automated debug APK build for **PDF MASTER**.

            ### Direct Download
            `https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk`
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
